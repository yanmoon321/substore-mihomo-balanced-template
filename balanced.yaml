dns:
  enable: true
  ipv6: false
  cache-algorithm: arc
  use-hosts: true
  use-system-hosts: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - +.home.arpa
    - localhost.ptlogin2.qq.com
    - +.srv.nintendo.net
    - +.stun.playstation.net
    - +.msftconnecttest.com
    - +.msftncsi.com
    - +.xboxlive.com
    - xbox.*.microsoft.com
    - stun.*
    - stun.*.*
    - stun.*.*.*
    - '*.stun.*'
    - '*.stun.*.*'
    - '*.stun.*.*.*'
    - '*.battlenet.com.cn'
    - '*.battlenet.com'
    - '*.blzstatic.cn'
    - '*.battle.net'
  default-nameserver:
    - 223.5.5.5
    - 1.12.12.12
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
proxies:
  - name: SUBSTORE_DYNAMIC_NODE_PLACEHOLDER
    type: ss
    server: placeholder.invalid
    port: 443
    cipher: aes-128-gcm
    password: placeholder
    udp: true
proxy-groups:
  - type: select
    name: 🚀 节点选择
    proxies:
      - ⚡ 自动选择
      - SUBSTORE_DYNAMIC_NODE_PLACEHOLDER
      - DIRECT
      - REJECT
  - name: ⚡ 自动选择
    type: url-test
    proxies:
      - SUBSTORE_DYNAMIC_NODE_PLACEHOLDER
    url: https://www.gstatic.com/generate_204
    interval: 300
    lazy: false
  - type: select
    name: 💬 AI 服务
    proxies:
      - 🚀 节点选择
      - SUBSTORE_DYNAMIC_NODE_PLACEHOLDER
      - DIRECT
      - REJECT
  - type: select
    name: 🔍 谷歌服务
    proxies:
      - 🚀 节点选择
      - SUBSTORE_DYNAMIC_NODE_PLACEHOLDER
      - DIRECT
